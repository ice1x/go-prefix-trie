name: Security Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false

    - name: Verify Go installation
      run: go version

    - name: Run go vet
      run: go vet ./...

    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest

    - name: Run gosec security scanner
      run: gosec -fmt=json -out=gosec-report.json ./...
      continue-on-error: true

    - name: Display gosec results
      if: always()
      run: |
        if [ -f gosec-report.json ]; then
          echo "📊 Security Scan Results:"
          cat gosec-report.json | jq '.Stats' || cat gosec-report.json
          echo ""
          issues=$(cat gosec-report.json | jq '.Stats.found // 0')
          if [ "$issues" -eq 0 ]; then
            echo "✅ No security issues found!"
          else
            echo "⚠️ Found $issues potential security issues. Check the artifact for details."
          fi
        fi

    - name: Upload gosec report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gosec-security-report
        path: gosec-report.json
        retention-days: 30

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Check for vulnerabilities
      run: |
        echo "🔍 Scanning for known vulnerabilities..."
        govulncheck ./...
        echo "✅ No vulnerabilities found in dependencies!"
