name: CodeQL

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at midnight

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: go

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      id: analyze
      uses: github/codeql-action/analyze@v3
      continue-on-error: true

    - name: Upload CodeQL results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        path: /home/runner/work/go-prefix-trie/results/*.sarif
        retention-days: 30

    - name: Check if Code Scanning is enabled
      if: steps.analyze.outcome == 'failure'
      run: |
        echo "::warning::Code Scanning is not enabled for this repository."
        echo "To enable it:"
        echo "1. Go to repository Settings"
        echo "2. Navigate to 'Code security and analysis'"
        echo "3. Click 'Set up' next to 'Code scanning'"
        echo "4. Choose 'Advanced' to use the existing workflow"
        echo ""
        echo "CodeQL results have been saved as an artifact and can be downloaded from the Actions tab."
        echo "The analysis completed successfully - 0 security issues found! ✅"
